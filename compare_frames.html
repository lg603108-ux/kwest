<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка видеокадров</title><style>body{background:#1b3138;color:white;font:18px sans-serif;margin:20px}section{display:flex;gap:20px}video,canvas{width:45vw;background:#34646c}button,select{font:inherit;padding:10px}pre{white-space:pre-wrap}</style><h1>Исходное видео и кадры на canvas</h1><p>Слева — прямой WebM, справа — тот же ролик через canvas. Здесь нет траекторий, покачивания и ускорения.</p><select id="file"><option>mon_octopus_move_green.webm</option><option>mon_spider_move_green.webm</option><option>mon_eye_idle_green.webm</option></select><button id="start">Запустить</button><section><div><h2>Прямое видео</h2><video id="v" muted loop playsinline controls></video></div><div><h2>Canvas</h2><canvas id="c" width="1920" height="1080"></canvas></div></section><pre id="report"></pre><p>Через 10 секунд скопируйте отчёт и пришлите запись сравнения, если движение справа отличается от левого.</p><script>
const v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d');let callbacks=0,draws=0,meta={},started=0,fail='';
function frame(now,m){callbacks++;meta=m;v.requestVideoFrameCallback(frame);}if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(frame);
function draw(){if(v.readyState>=2){x.clearRect(0,0,1920,1080);x.drawImage(v,0,0);draws++;}requestAnimationFrame(draw);}draw();
document.getElementById('start').onclick=async()=>{callbacks=0;draws=0;started=performance.now();fail='';v.src='assets/'+encodeURIComponent(document.getElementById('file').value);try{await v.play();}catch(e){fail=e.name+': '+e.message;}};
setInterval(()=>{const q=v.getVideoPlaybackQuality?.();document.getElementById('report').textContent=JSON.stringify({browser:navigator.userAgent,file:document.getElementById('file').value,seconds:(performance.now()-started)/1000,currentTime:v.currentTime,paused:v.paused,readyState:v.readyState,frameCallbacks:callbacks,presentedFrames:meta.presentedFrames,frameMediaTime:meta.mediaTime,canvasDraws:draws,totalVideoFrames:q?.totalVideoFrames,droppedVideoFrames:q?.droppedVideoFrames,error:fail||v.error?.code},null,2);},1000);
</script></html>
